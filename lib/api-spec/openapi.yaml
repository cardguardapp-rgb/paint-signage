openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Paint & Signage Job Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: clients
    description: Client management
  - name: jobs
    description: Job/Project management
  - name: estimates
    description: Estimate/Quote management
  - name: quotes
    description: Public customer quote portal
  - name: dashboard
    description: Dashboard and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Clients
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Jobs
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid stage transition
        "404":
          description: Not found
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /jobs/{id}/advance-stage:
    post:
      operationId: advanceJobStage
      tags: [jobs]
      summary: Advance a job to the next stage (enforces state-machine rules)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stage advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Cannot advance stage (business rule violation)
        "404":
          description: Not found

  # Estimates
  /jobs/{jobId}/estimates:
    get:
      operationId: listEstimates
      tags: [estimates]
      summary: List estimates for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Estimate"
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create an estimate for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"

  /jobs/{jobId}/estimates/{id}:
    get:
      operationId: getEstimate
      tags: [estimates]
      summary: Get a specific estimate
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estimate found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404":
          description: Not found
    patch:
      operationId: updateEstimate
      tags: [estimates]
      summary: Update an estimate
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimatePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404":
          description: Not found
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      summary: Delete an estimate
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /jobs/{jobId}/estimates/{id}/approve:
    post:
      operationId: approveEstimate
      tags: [estimates]
      summary: Approve an estimate internally (moves job to Approved stage)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estimate approved and job stage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404":
          description: Not found

  /jobs/{jobId}/estimates/{id}/share:
    post:
      operationId: shareEstimate
      tags: [estimates]
      summary: Generate a shareable customer web-view link for this estimate
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share token and URL generated, estimate status set to Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResult"
        "404":
          description: Not found

  # Public customer quote portal
  /quotes/{token}:
    get:
      operationId: getPublicQuote
      tags: [quotes]
      summary: Get a customer-facing quote by share token (public, no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer-facing quote view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerQuoteView"
        "404":
          description: Quote not found or expired

  /quotes/{token}/respond:
    post:
      operationId: respondToQuote
      tags: [quotes]
      summary: Customer approves or requests changes on a shared quote
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteResponse"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerQuoteView"
        "404":
          description: Quote not found

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      responses:
        "200":
          description: Dashboard summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/pipeline:
    get:
      operationId: getPipelineStats
      tags: [dashboard]
      summary: Get job counts and value grouped by stage
      responses:
        "200":
          description: Pipeline statistics by stage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStat"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent job activity (last 10 updates)
      responses:
        "200":
          description: Recent job activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # Users
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [Admin, ProjectManager, Estimator, FieldCrew]
        phone:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        role:
          type: string
          enum: [Admin, ProjectManager, Estimator, FieldCrew]
        phone:
          type: string

    UserPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        role:
          type: string
          enum: [Admin, ProjectManager, Estimator, FieldCrew]
        phone:
          type: string

    # Clients
    Client:
      type: object
      required: [id, companyName, contactName, email, createdAt]
      properties:
        id:
          type: integer
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        billingAddress:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ClientInput:
      type: object
      required: [companyName, contactName, email]
      properties:
        companyName:
          type: string
          minLength: 1
        contactName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
        billingAddress:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        notes:
          type: string

    ClientPatch:
      type: object
      properties:
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        billingAddress:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        notes:
          type: string

    # Jobs
    Job:
      type: object
      required: [id, title, stage, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        stage:
          type: string
          enum: [Lead, Quoting, Approved, Scheduled, InProgress, ComplianceReview, Invoiced, Closed]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        assignedToId:
          type: ["integer", "null"]
        assignedToName:
          type: ["string", "null"]
        estimatedValue:
          type: ["number", "null"]
        scheduledStart:
          type: ["string", "null"]
        scheduledEnd:
          type: ["string", "null"]
        siteAddress:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        hasApprovedEstimate:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    JobInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        clientId:
          type: integer
        assignedToId:
          type: integer
        scheduledStart:
          type: string
        scheduledEnd:
          type: string
        siteAddress:
          type: string
        notes:
          type: string

    JobPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        stage:
          type: string
          enum: [Lead, Quoting, Approved, Scheduled, InProgress, ComplianceReview, Invoiced, Closed]
        clientId:
          type: integer
        assignedToId:
          type: integer
        scheduledStart:
          type: string
        scheduledEnd:
          type: string
        siteAddress:
          type: string
        notes:
          type: string

    # Estimates — Internal Budget
    InternalBudgetItem:
      type: object
      required: [category, description, quantity, unitCost]
      properties:
        category:
          type: string
          enum: [Labor, Material, Equipment]
        description:
          type: string
        quantity:
          type: number
        unitCost:
          type: number
        unit:
          type: string

    # Estimates — Customer-Facing Line Items
    EstimateLineItem:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        description:
          type: string
        displayName:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        unit:
          type: string

    Estimate:
      type: object
      required: [id, jobId, status, markupPercentage, customerTotal, internalCost, margin, marginStatus, grossProfit, createdAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        title:
          type: ["string", "null"]
        status:
          type: string
          enum: [Draft, Sent, Approved, Rejected]
        internalBudgetItems:
          type: array
          items:
            $ref: "#/components/schemas/InternalBudgetItem"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        markupPercentage:
          type: number
        customerTotal:
          type: number
        internalCost:
          type: number
        margin:
          type: number
        marginStatus:
          type: string
          enum: [Healthy, Warning, Critical]
        grossProfit:
          type: number
        shareToken:
          type: ["string", "null"]
        customerStatus:
          type: string
          enum: [NotShared, Pending, Approved, ChangesRequested]
        customerNote:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    EstimateInput:
      type: object
      required: [markupPercentage]
      properties:
        title:
          type: string
        internalBudgetItems:
          type: array
          items:
            $ref: "#/components/schemas/InternalBudgetItem"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        markupPercentage:
          type: number
        notes:
          type: string

    EstimatePatch:
      type: object
      properties:
        title:
          type: string
        internalBudgetItems:
          type: array
          items:
            $ref: "#/components/schemas/InternalBudgetItem"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        markupPercentage:
          type: number
        status:
          type: string
          enum: [Draft, Sent, Approved, Rejected]
        notes:
          type: string

    ShareResult:
      type: object
      required: [shareToken, shareUrl, estimate]
      properties:
        shareToken:
          type: string
        shareUrl:
          type: string
        estimate:
          $ref: "#/components/schemas/Estimate"

    CustomerQuoteView:
      type: object
      required: [estimate, jobTitle, companyName, clientName]
      properties:
        estimate:
          $ref: "#/components/schemas/Estimate"
        jobTitle:
          type: string
        siteAddress:
          type: ["string", "null"]
        companyName:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string

    QuoteResponse:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, request_changes]
        note:
          type: string

    # Dashboard
    DashboardSummary:
      type: object
      required: [totalJobs, activeJobs, totalPipelineValue, jobsNeedingAttention, estimatesPendingApproval, closedThisMonth]
      properties:
        totalJobs:
          type: integer
        activeJobs:
          type: integer
        totalPipelineValue:
          type: number
        jobsNeedingAttention:
          type: integer
        estimatesPendingApproval:
          type: integer
        closedThisMonth:
          type: integer

    PipelineStat:
      type: object
      required: [stage, count, totalValue]
      properties:
        stage:
          type: string
        count:
          type: integer
        totalValue:
          type: number

    ActivityItem:
      type: object
      required: [id, jobId, jobTitle, action, timestamp]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        jobTitle:
          type: string
        action:
          type: string
        stage:
          type: string
        timestamp:
          type: string
